name: Backend quality
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anima_test
          POSTGRES_USER: anima
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anima -d anima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: "only-ci-secret-not-production-very-long-string"
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS_REDIRECT: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "postgresql://anima:ci_test_password@localhost:5432/anima_test"
      REDIS_URL: "redis://localhost:6379/0"
      DJANGO_EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check --select E4,E7,E9,F backend
      - name: Django system and migration checks
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: API and domain tests
        run: cd backend && pytest -q
